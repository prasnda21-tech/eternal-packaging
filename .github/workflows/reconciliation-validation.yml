name: Reconciliation validation

on:
  pull_request:
    branches:
      - main
      - cursor/hpp-financial-opening-13bd
      - cursor/sales-order-redesign-b7d7
      - cursor/purchasing-pr-v4-preview-716f
  workflow_dispatch:
    inputs:
      run_live_orders:
        description: >-
          Run the read-only live orders summary check. Requires secrets
          LIVE_ORDERS_MONGO_URL and LIVE_ORDERS_DB_NAME for a database that
          already has at least one non-cancelled order at current_stage >= 14.
          The job does not seed or write orders.
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-focused:
    name: Backend focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: eternal_packaging_ci
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused-test dependencies
        run: >-
          python -m pip install
          pytest==9.1.1
          pytest-xdist==3.8.0
          anyio==4.14.2
          fastapi==0.110.1
          httpx==0.28.1
          pymongo==4.6.3
          python-dotenv==1.2.2
          motor==3.3.1
          bcrypt==4.1.3
          PyJWT==2.13.0
          python-multipart==0.0.32
          boto3==1.43.74
          reportlab==4.1.0
          requests==2.34.2
          openpyxl==3.1.5
          pdfplumber==0.11.10
      - name: Accounting final reconciliation audit hardening
        run: python scripts/tests/test_accounting_final_reconciliation_categories.py
      - name: Accounting exception investigation classifiers
        run: python scripts/tests/test_accounting_exception_investigation.py
      # Screen regressions stay in this job. The live orders comparison is
      # collected here and skips unless LIVE_ORDERS_SUMMARY=1. Finance modules
      # and the two pre-existing finance tests stay enabled.
      #
      # Isolation note (PR #606 CI hang at ~85%): combining modules that set
      # DB_NAME / import server at collection time with the large
      # test_financial_inventory_opening + confirm_delivered_sj_stock suites
      # can stall xdist with no further output (same class of hang previously
      # fixed for sales_invoice_edit_revision). Keep coverage; split suites
      # into measured, fail-closed timeout steps. Never raise job timeout only.
      - name: Run compatibility and Sales PWA tests
        working-directory: backend
        timeout-minutes: 8
        run: |
          set -euo pipefail
          echo "Starting compatibility/Sales PWA suite (xdist loadscope)"
          set +e
          timeout --signal=TERM --kill-after=15s 420s \
            python -m pytest -q \
            tests/test_stock_engine_v2.py \
            tests/test_stock_v2_off_state_compat.py \
            tests/test_line_product_replacement_concurrency.py \
            tests/test_sales_pwa_scope.py \
            tests/test_inventory_issue_posting.py \
            tests/test_financial_dashboard.py \
            tests/test_nav_permissions.py \
            tests/test_sales_order_line_prices.py \
            tests/test_sales_order_item_images.py \
            tests/test_sales_order_list_read.py \
            tests/test_customer_tracking.py \
            tests/test_live_tracking_url.py \
            tests/test_customer_tracking_invoices.py \
            tests/test_tracking_delivery_signature.py \
            tests/test_sales_customer_credit.py \
            tests/test_sales_receipt_posting.py \
            tests/test_sales_receipt_payment_proof.py \
            tests/test_sales_invoices_and_receipts.py \
            tests/test_physical_stock_engine.py \
            tests/test_operator_schedule.py \
            tests/test_division_tasks.py::test_line_tasks_copy_exact_line_screen_size \
            tests/test_division_tasks.py::test_operator_task_keeps_each_allocation_screen \
            tests/test_division_tasks.py::test_operator_task_keeps_screen_when_line_mirror_empty \
            tests/test_production_dashboard_summary.py \
            tests/test_master_items.py \
            tests/test_quantity_invariants.py
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error::compatibility/Sales PWA tests exited with status ${status}"
            echo "--- process snapshot ---"
            ps -eo pid,ppid,stat,etime,cmd --sort=etime | head -80 || true
            echo "--- mongo ping ---"
            mongosh --quiet mongodb://127.0.0.1:27017 --eval 'db.runCommand({ ping: 1 })' || true
            exit "${status}"
          fi
      # Pins DB_NAME at import and imports server; run serial + dedicated DB so
      # it cannot stall the combined xdist job after ~85% with no output.
      - name: Run financial inventory opening tests
        working-directory: backend
        timeout-minutes: 5
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: eternal_packaging_ci_financial_inventory_opening
          JWT_SECRET: ci-only-secret
        run: |
          set -euo pipefail
          echo "Starting isolated financial inventory opening suite (serial, dedicated DB_NAME)"
          set +e
          timeout --signal=TERM --kill-after=15s 240s \
            python -m pytest -vv -n 0 --durations=20 \
            tests/test_financial_inventory_opening.py
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error::financial inventory opening tests exited with status ${status}"
            echo "--- process snapshot ---"
            ps -eo pid,ppid,stat,etime,cmd --sort=etime | head -80 || true
            echo "--- mongo ping ---"
            mongosh --quiet mongodb://127.0.0.1:27017 --eval 'db.runCommand({ ping: 1 })' || true
            exit "${status}"
          fi
      # Imports server + pins DB_NAME; isolate so confirm-delivered HTTP paths
      # cannot deadlock the shared xdist worker pool.
      - name: Run confirm-delivered SJ stock tests
        working-directory: backend
        timeout-minutes: 5
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: eternal_confirm_sj_stock_test
          JWT_SECRET: ci-only-secret
          APP_ENV: test
        run: |
          set -euo pipefail
          echo "Starting isolated confirm-delivered SJ stock suite (serial, dedicated DB_NAME)"
          set +e
          timeout --signal=TERM --kill-after=15s 180s \
            python -m pytest -vv -n 0 --durations=20 \
            tests/test_confirm_delivered_sj_stock.py
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error::confirm-delivered SJ stock tests exited with status ${status}"
            echo "--- process snapshot ---"
            ps -eo pid,ppid,stat,etime,cmd --sort=etime | head -80 || true
            echo "--- mongo ping ---"
            mongosh --quiet mongodb://127.0.0.1:27017 --eval 'db.runCommand({ ping: 1 })' || true
            exit "${status}"
          fi
      # Phase 2.2C revision suite must run alone: it sets DB_NAME at import and
      # previously hung the combined xdist job after ~87% with no further output.
      # Capture status AFTER timeout/pytest (never inside `if ! …; status=$?`).
      # Inside `if !`, bash resets $? to 0 because the if-compound succeeded —
      # a failing suite then `exit 0` and the job stays false-green.
      - name: Prove CI timeout exit-code capture
        run: bash scripts/tests/test_ci_timeout_exit_capture.sh
      - name: Run sales invoice edit revision tests
        working-directory: backend
        timeout-minutes: 5
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: eternal_packaging_ci_sales_invoice_edit_revision
          JWT_SECRET: ci-only-secret
        run: |
          set -euo pipefail
          echo "Starting isolated revision suite (serial, dedicated DB_NAME)"
          set +e
          timeout --signal=TERM --kill-after=15s 180s \
            python -m pytest -vv -n 0 --durations=20 \
            tests/test_sales_invoice_edit_revision.py
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error::sales invoice edit revision tests exited with status ${status}"
            echo "--- process snapshot ---"
            ps -eo pid,ppid,stat,etime,cmd --sort=etime | head -80 || true
            echo "--- mongo ping ---"
            mongosh --quiet mongodb://127.0.0.1:27017 --eval 'db.runCommand({ ping: 1 })' || true
            exit "${status}"
          fi
      # Phase 2.2D business-cancel suite also pins DB_NAME at import; run serial
      # and isolated so it cannot collide with other sales accounting modules.
      - name: Run sales business cancel tests
        working-directory: backend
        timeout-minutes: 5
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: eternal_packaging_ci_sales_business_cancel
          JWT_SECRET: ci-only-secret
        run: |
          set -euo pipefail
          echo "Starting isolated business-cancel suite (serial, dedicated DB_NAME)"
          set +e
          timeout --signal=TERM --kill-after=15s 180s \
            python -m pytest -vv -n 0 --durations=20 \
            tests/test_sales_business_cancel.py
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error::sales business cancel tests exited with status ${status}"
            echo "--- process snapshot ---"
            ps -eo pid,ppid,stat,etime,cmd --sort=etime | head -80 || true
            echo "--- mongo ping ---"
            mongosh --quiet mongodb://127.0.0.1:27017 --eval 'db.runCommand({ ping: 1 })' || true
            exit "${status}"
          fi
      # Package C receipt edit-revision suite pins DB_NAME at import; run serial.
      - name: Run sales receipt edit revision tests
        working-directory: backend
        timeout-minutes: 5
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: eternal_packaging_ci_sales_receipt_edit_revision
          JWT_SECRET: ci-only-secret
        run: |
          set -euo pipefail
          echo "Starting isolated receipt edit-revision suite (serial, dedicated DB_NAME)"
          set +e
          timeout --signal=TERM --kill-after=15s 180s \
            python -m pytest -vv -n 0 --durations=20 \
            tests/test_sales_receipt_edit_revision.py
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error::sales receipt edit revision tests exited with status ${status}"
            echo "--- process snapshot ---"
            ps -eo pid,ppid,stat,etime,cmd --sort=etime | head -80 || true
            echo "--- mongo ping ---"
            mongosh --quiet mongodb://127.0.0.1:27017 --eval 'db.runCommand({ ping: 1 })' || true
            exit "${status}"
          fi
      # Phase 3 lifecycle capability suite pins DB_NAME at import; run serial.
      - name: Run sales lifecycle capability tests
        working-directory: backend
        timeout-minutes: 5
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: eternal_packaging_ci_sales_lifecycle_capability
          JWT_SECRET: ci-only-secret
        run: |
          set -euo pipefail
          echo "Starting isolated lifecycle capability suite (serial, dedicated DB_NAME)"
          set +e
          timeout --signal=TERM --kill-after=15s 180s \
            python -m pytest -vv -n 0 --durations=20 \
            tests/test_sales_lifecycle_capability.py
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error::sales lifecycle capability tests exited with status ${status}"
            echo "--- process snapshot ---"
            ps -eo pid,ppid,stat,etime,cmd --sort=etime | head -80 || true
            echo "--- mongo ping ---"
            mongosh --quiet mongodb://127.0.0.1:27017 --eval 'db.runCommand({ ping: 1 })' || true
            exit "${status}"
          fi
      # Phase 2 Package A five-tab list suite pins DB_NAME at import; run serial.
      - name: Run sales list five-tab tests
        working-directory: backend
        timeout-minutes: 5
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: eternal_packaging_ci_sales_list_tabs
          JWT_SECRET: ci-only-secret
        run: |
          set -euo pipefail
          echo "Starting isolated sales list five-tab suite (serial, dedicated DB_NAME)"
          set +e
          timeout --signal=TERM --kill-after=15s 180s \
            python -m pytest -vv -n 0 --durations=20 \
            tests/test_sales_list_tabs.py
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error::sales list five-tab tests exited with status ${status}"
            echo "--- process snapshot ---"
            ps -eo pid,ppid,stat,etime,cmd --sort=etime | head -80 || true
            echo "--- mongo ping ---"
            mongosh --quiet mongodb://127.0.0.1:27017 --eval 'db.runCommand({ ping: 1 })' || true
            exit "${status}"
          fi
      # Cash-bank Accurate 1:N group match + Owner View pin DB_NAME at import.
      # Same exit-capture contract as the sales isolated suites above.
      - name: Run cash-bank recon group and owner tests
        working-directory: backend
        timeout-minutes: 5
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          # Must be >= 16 chars: statement preview HMAC refuses shorter secrets.
          JWT_SECRET: ci-only-secret-cash-bank-32
        run: |
          set -euo pipefail
          echo "Starting isolated cash-bank recon group/owner suite (serial)"
          set +e
          timeout --signal=TERM --kill-after=15s 180s \
            python -m pytest -vv -n 0 --durations=20 \
            tests/test_cash_bank_recon_group_match.py \
            tests/test_cash_bank_owner_recon.py
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error::cash-bank recon group/owner tests exited with status ${status}"
            echo "--- process snapshot ---"
            ps -eo pid,ppid,stat,etime,cmd --sort=etime | head -80 || true
            echo "--- mongo ping ---"
            mongosh --quiet mongodb://127.0.0.1:27017 --eval 'db.runCommand({ ping: 1 })' || true
            exit "${status}"
          fi

  # Isolated from backend-focused: stock compatibility read needs replicaSet=eternal_local_rs.
  backend-stock-compat-rs:
    name: Backend stock compatibility (replica set)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=eternal_local_rs
      APP_ENV: test
      DB_NAME: eternal_packaging_ci_stock_compat
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Start MongoDB 7 replica set eternal_local_rs
        run: |
          set -euo pipefail
          docker run -d --rm --name mongo-eternal-rs \
            -p 27017:27017 \
            mongo:7 --replSet eternal_local_rs --bind_ip_all
          echo "Waiting for mongod ping..."
          for i in $(seq 1 60); do
            if docker exec mongo-eternal-rs mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              echo "mongod up"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "timeout waiting for mongod"
              docker logs mongo-eternal-rs || true
              exit 1
            fi
            sleep 1
          done
          docker exec mongo-eternal-rs mongosh --quiet --eval \
            'rs.initiate({_id:"eternal_local_rs", members:[{_id:0, host:"127.0.0.1:27017"}]})' \
            || true
          echo "Waiting for replica set primary..."
          for i in $(seq 1 60); do
            if docker exec mongo-eternal-rs mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -qi true; then
              echo "primary ready"
              exit 0
            fi
            sleep 1
          done
          echo "timeout waiting for primary"
          docker exec mongo-eternal-rs mongosh --quiet --eval 'rs.status()' || true
          docker logs mongo-eternal-rs || true
          exit 1
      - name: Install stock-compat test dependencies
        run: >-
          python -m pip install
          pytest==9.1.1
          pytest-xdist==3.8.0
          anyio==4.14.2
          fastapi==0.110.1
          httpx==0.28.1
          pymongo==4.6.3
          python-dotenv==1.2.2
          motor==3.3.1
          bcrypt==4.1.3
          PyJWT==2.13.0
          python-multipart==0.0.32
          boto3==1.43.74
          reportlab==4.1.0
          requests==2.34.2
          openpyxl==3.1.5
          pdfplumber==0.11.10
      - name: Run test_stock_compatibility_read.py
        working-directory: backend
        run: python -m pytest -q -n 0 tests/test_stock_compatibility_read.py
      # Stock opname suites need multi-doc transactions (replica set). Each file
      # pins its own TEST_DB; R2 authority is fixture-only inside those DBs.
      - name: Run stock opname operational suite (replica set)
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=eternal_local_rs
          DB_NAME: eternal_packaging_ci_stock_opname_operational
        run: >-
          python -m pytest -vv -n 0 --tb=short
          tests/test_stock_opname_operational.py
      - name: Run stock opname freeze regression suite (replica set)
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=eternal_local_rs
          DB_NAME: eternal_packaging_ci_stock_opname_freeze
        run: >-
          python -m pytest -vv -n 0 --tb=short
          tests/test_stock_opname_r2.py
      # Local master create index readiness gates (replica set; dedicated TEST_DB).
      - name: Run local master items mongo suite (replica set)
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=eternal_local_rs
          DB_NAME: eternal_packaging_test_master_local_create
        run: >-
          python -m pytest -vv -n 0 --tb=short
          tests/test_master_items_local_mongo.py
      - name: Run warehouse A/B separation suite (replica set)
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=eternal_local_rs
          DB_NAME: eternal_packaging_ci_warehouse_ab_sep
        run: >-
          python -m pytest -vv -n 0 --tb=short
          tests/test_warehouse_stock_separation_ab.py
      - name: Run warehouse A/B HTTP login flow (replica set)
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=eternal_local_rs
          DB_NAME: eternal_packaging_test_warehouse_ab_http
          JWT_SECRET: ci-only-secret
          APP_ENV: test
        run: >-
          python -m pytest -vv -n 0 --tb=short
          tests/test_warehouse_ab_http_flow.py
      # STATUS_CETAK demand vs R2 physical (isolated DB; needs replica set txns).
      - name: Run STATUS_CETAK R2 demand suite (replica set)
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=eternal_local_rs
          DB_NAME: eternal_packaging_test_status_cetak_r2_demand
        run: >-
          python -m pytest -vv -n 0 --tb=short
          tests/test_status_cetak_r2_demand.py
      # R2 ON: block PSS stock-out dual-write; no confirm-delivered PSS fallback.
      - name: Run R2 no-PSS dual-write suite (replica set)
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=eternal_local_rs
          DB_NAME: eternal_packaging_test_r2_no_pss_dual_write
        run: >-
          python -m pytest -vv -n 0 --tb=short
          tests/test_r2_no_pss_dual_write.py
      # R2 book may go negative; missing baseline = unreconciled (not a block).
      - name: Run R2 allow-negative book suite (replica set)
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=eternal_local_rs
          DB_NAME: eternal_packaging_test_r2_allow_negative_book
        run: >-
          python -m pytest -vv -n 0 --tb=short
          tests/test_r2_allow_negative_book.py
      # Target adjust + concurrent zero-delta reconciliation (isolated RS DB).
      - name: Run physical adjustment suite (replica set)
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=eternal_local_rs
          DB_NAME: eternal_packaging_test_physical_adjustment
          APP_ENV: test
          JWT_SECRET: ci-only-secret
        run: >-
          python -m pytest -vv -n 0 --tb=short
          tests/test_physical_adjustment.py
      # Opname zero-diff unreconciled → reconcile_only audit (isolated RS DB).
      - name: Run opname zero-diff audit suite (replica set)
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=eternal_local_rs
          DB_NAME: eternal_packaging_test_opname_zero_diff_audit
        run: >-
          python -m pytest -vv -n 0 --tb=short
          tests/test_opname_zero_diff_audit.py
      # Option B SJ cancel → REVERSAL + intervening-mutation fail-closed (isolated RS DB).
      - name: Run sales delivery R2 cancel suite (replica set)
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=eternal_local_rs
          DB_NAME: eternal_packaging_test_sales_delivery_r2_cancel_http
          APP_ENV: test
          JWT_SECRET: ci-only-secret-sales-delivery-r2-cancel-32
          CORS_ORIGINS: "*"
        run: >-
          python -m pytest -vv -n 0 --tb=short
          tests/test_sales_delivery_r2_cancel_http.py
      # Full R2 inventory chain on isolated RS test DB (never preview/production).
      - name: Run R2 inventory E2E suite (replica set)
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=eternal_local_rs
          DB_NAME: eternal_packaging_test_r2_inventory_e2e
        run: >-
          python -m pytest -vv -n 0 --tb=short
          tests/test_r2_inventory_e2e.py

  # Warehouse standalone engine must run on mongod WITHOUT --replSet (no multi-doc txn).
  backend-warehouse-standalone:
    name: Backend warehouse stock standalone
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STANDALONE_MONGO_URL: mongodb://127.0.0.1:27018
      APP_ENV: test
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Start MongoDB 7 standalone (no replica set)
        run: |
          set -euo pipefail
          docker run -d --rm --name mongo-eternal-standalone \
            -p 27018:27017 \
            mongo:7 --bind_ip_all
          echo "Waiting for standalone mongod ping..."
          for i in $(seq 1 60); do
            if docker exec mongo-eternal-standalone mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              echo "mongod up"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "timeout waiting for mongod"
              docker logs mongo-eternal-standalone || true
              exit 1
            fi
            sleep 1
          done
          setName="$(docker exec mongo-eternal-standalone mongosh --quiet --eval 'db.hello().setName' 2>/dev/null || true)"
          if [ -n "${setName}" ] && [ "${setName}" != "null" ] && [ "${setName}" != "undefined" ]; then
            echo "Refusing RS topology for standalone suite: setName=${setName}"
            exit 1
          fi
          echo "standalone topology confirmed (setName empty/null)"
      - name: Install standalone-test dependencies
        run: >-
          python -m pip install
          pytest==9.1.1
          pytest-xdist==3.8.0
          anyio==4.14.2
          fastapi==0.110.1
          httpx==0.28.1
          pymongo==4.6.3
          python-dotenv==1.2.2
          motor==3.3.1
          bcrypt==4.1.3
          PyJWT==2.13.0
          python-multipart==0.0.32
          boto3==1.43.74
          reportlab==4.1.0
          requests==2.34.2
          openpyxl==3.1.5
          pdfplumber==0.11.10
      - name: Run warehouse stock standalone suite
        working-directory: backend
        env:
          STANDALONE_MONGO_URL: mongodb://127.0.0.1:27018
          APP_ENV: test
          JWT_SECRET: ci-only-secret
        run: >-
          python -m pytest -vv -n 0 --tb=short
          tests/test_warehouse_stock_standalone.py
          tests/test_confirm_delivered_standalone_retry.py

  backend-live-orders:
    name: Backend live orders summary
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_orders }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGO_URL: ${{ secrets.LIVE_ORDERS_MONGO_URL }}
      DB_NAME: ${{ secrets.LIVE_ORDERS_DB_NAME }}
      LIVE_ORDERS_DB_NAME: ${{ secrets.LIVE_ORDERS_DB_NAME }}
      JWT_SECRET: ci-only-secret
      LIVE_ORDERS_SUMMARY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install live-check dependencies
        run: >-
          python -m pip install
          pytest==9.1.1
          pytest-xdist==3.8.0
          anyio==4.14.2
          fastapi==0.110.1
          httpx==0.28.1
          pymongo==4.6.3
          python-dotenv==1.2.2
          motor==3.3.1
          bcrypt==4.1.3
          PyJWT==2.13.0
          python-multipart==0.0.32
          boto3==1.43.74
          reportlab==4.1.0
          requests==2.34.2
          openpyxl==3.1.5
          pdfplumber==0.11.10
      - name: Require an existing completed-order database
        run: |
          python - <<'PY'
          import os
          import sys

          missing = []
          if not os.environ.get("MONGO_URL", "").strip():
              missing.append("LIVE_ORDERS_MONGO_URL")
          if not os.environ.get("LIVE_ORDERS_DB_NAME", "").strip():
              missing.append("LIVE_ORDERS_DB_NAME")
          if not missing:
              raise SystemExit(0)
          print("Live orders summary job cannot start.")
          print("Missing repository secrets: " + ", ".join(missing))
          print("Prerequisites:")
          print("- secret LIVE_ORDERS_MONGO_URL")
          print("- secret LIVE_ORDERS_DB_NAME")
          print("- that database already contains at least one non-cancelled order with current_stage >= 14")
          print("This job does not seed or write orders.")
          sys.exit(1)
          PY
      - name: Compare full and summary rows on the live database
        working-directory: backend
        run: >-
          python -m pytest -q -n 0
          tests/test_production_dashboard_summary.py::test_live_summary_matches_default_visible_columns

  frontend-focused:
