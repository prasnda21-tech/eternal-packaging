name: Reconciliation validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-focused:
    name: Backend focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: eternal_packaging_ci
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run Stock compatibility tests
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_stock_engine_v2.py
          tests/test_stock_v2_off_state_compat.py

  frontend-focused:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REACT_APP_BACKEND_URL: http://127.0.0.1:8000
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Run focused frontend tests
        env:
          CI: "true"
        run: >-
          npm test -- --watchAll=false --runInBand
          src/App.boot.test.js
          src/App.phase2a.lazyRoutes.test.js
          src/mobile/MobileRoutes.test.js
          src/lib/mobileOpsSession.test.js
          src/lib/mobileTaskListRetention.test.js
          src/mobile/MobileTasksPage.test.js
          src/pages/HoPDashboard.test.js
          src/pages/inventoryPersediaanLiveSearch.contract.test.js
      - name: Build production frontend
        env:
          CI: "false"
          DISABLE_ESLINT_PLUGIN: "true"
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
