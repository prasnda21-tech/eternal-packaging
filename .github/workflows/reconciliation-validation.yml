name: Reconciliation validation

on:
  pull_request:
    branches:
      - main
      - cursor/hpp-financial-opening-13bd
      - cursor/sales-order-redesign-b7d7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-focused:
    name: Backend focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: eternal_packaging_ci
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused-test dependencies
        run: >-
          python -m pip install
          pytest==9.1.1
          pytest-xdist==3.8.0
          anyio==4.14.2
          fastapi==0.110.1
          httpx==0.28.1
          pymongo==4.6.3
          python-dotenv==1.2.2
          motor==3.3.1
          bcrypt==4.1.3
          PyJWT==2.13.0
          python-multipart==0.0.32
          boto3==1.43.74
          reportlab==4.1.0
          requests==2.34.2
          openpyxl==3.1.5
          pdfplumber==0.11.10
      - name: Run compatibility and Sales PWA tests
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_stock_engine_v2.py
          tests/test_stock_v2_off_state_compat.py
          tests/test_line_product_replacement_concurrency.py
          tests/test_sales_pwa_scope.py
          tests/test_financial_inventory_opening.py
          tests/test_inventory_issue_posting.py
          tests/test_financial_dashboard.py
          tests/test_nav_permissions.py
          tests/test_sales_order_line_prices.py
          tests/test_sales_order_item_images.py
          tests/test_sales_order_list_read.py
          tests/test_customer_tracking.py
          tests/test_customer_tracking_invoices.py
          tests/test_tracking_delivery_signature.py

  frontend-focused:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REACT_APP_BACKEND_URL: http://127.0.0.1:8000
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Run focused frontend tests
        env:
          CI: "true"
        run: >-
          npm test -- --watchAll=false --runInBand
          src/App.boot.test.js
          src/App.phase2a.lazyRoutes.test.js
          src/mobile/MobileRoutes.test.js
          src/mobile/MobileSuratJalanViewerPage.test.js
          src/lib/mobileOpsSession.test.js
          src/lib/mobileTaskListRetention.test.js
          src/lib/poDetailRetention.test.js
          src/mobile/MobileTasksPage.test.js
          src/pages/HoPDashboard.test.js
          src/pages/inventoryPersediaanLiveSearch.contract.test.js
          src/pages/NilaiPersediaan.test.js
          src/pages/NilaiPersediaan.interaction.test.js
          src/pages/BukuBesar.test.js
          src/pages/NeracaSaldo.test.js
          src/sales/SalesPwaLayout.test.js
          src/sales/SalesPwaOrdersPage.test.js
          src/sales/SalesPwaDashboardPage.test.js
          src/sales/SalesPwaVisitsPage.test.js
          src/lib/financialDashboard.test.js
          src/components/AppShell.test.js
          src/lib/navAccess.test.js
          src/lib/navAccess.cashBank.test.js
          src/lib/navAccess.employeeAdmin.test.js
          src/lib/navAccess.formAccess.test.js
          src/lib/navAccess.hrPayroll.test.js
          src/lib/navAccess.ledger.test.js
          src/lib/globalWorkspace.test.js
          src/lib/salesOrderCreateWorkspace.test.js
          src/pages/PesananPenjualan.createWorkspace.test.js
          src/pages/PesananPenjualan.test.js
          src/pages/FakturPenjualan.test.js
          src/components/MasterItemSearchSelect.picker.test.js
          src/lib/salesOrderListPresentation.test.js
          src/pages/PesananPenjualan.searchDebounce.test.js
          src/components/TrackingInvoicePdfViewer.test.js
          src/components/TrackingInvoices.test.js
          src/lib/customerTracking.test.js
          src/lib/liveTracking.test.js
          src/pages/CustomerTrackingPage.test.js
          src/pages/CustomerTrackingPage.onescreen.test.js
      - name: Build production frontend
        if: ${{ always() }}
        env:
          CI: "false"
          DISABLE_ESLINT_PLUGIN: "true"
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
