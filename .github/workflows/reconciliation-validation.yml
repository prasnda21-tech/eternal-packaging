name: Reconciliation validation

on:
  pull_request:
    branches:
      - main
      - cursor/hpp-financial-opening-13bd
      - cursor/sales-order-redesign-b7d7
  workflow_dispatch:
    inputs:
      run_live_orders:
        description: >-
          Run the read-only live orders summary check. Requires secrets
          LIVE_ORDERS_MONGO_URL and LIVE_ORDERS_DB_NAME for a database that
          already has at least one non-cancelled order at current_stage >= 14.
          The job does not seed or write orders.
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-focused:
    name: Backend focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: eternal_packaging_ci
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused-test dependencies
        run: >-
          python -m pip install
          pytest==9.1.1
          pytest-xdist==3.8.0
          anyio==4.14.2
          fastapi==0.110.1
          httpx==0.28.1
          pymongo==4.6.3
          python-dotenv==1.2.2
          motor==3.3.1
          bcrypt==4.1.3
          PyJWT==2.13.0
          python-multipart==0.0.32
          boto3==1.43.74
          reportlab==4.1.0
          requests==2.34.2
          openpyxl==3.1.5
          pdfplumber==0.11.10
      # Screen regressions stay in this job. The live orders comparison is
      # collected here and skips unless LIVE_ORDERS_SUMMARY=1. Finance modules
      # and the two pre-existing finance tests stay enabled.
      - name: Run compatibility and Sales PWA tests
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_stock_engine_v2.py
          tests/test_stock_v2_off_state_compat.py
          tests/test_line_product_replacement_concurrency.py
          tests/test_sales_pwa_scope.py
          tests/test_financial_inventory_opening.py
          tests/test_inventory_issue_posting.py
          tests/test_financial_dashboard.py
          tests/test_nav_permissions.py
          tests/test_sales_order_line_prices.py
          tests/test_sales_order_item_images.py
          tests/test_sales_order_list_read.py
          tests/test_customer_tracking.py
          tests/test_customer_tracking_invoices.py
          tests/test_tracking_delivery_signature.py
          tests/test_sales_customer_credit.py
          tests/test_sales_receipt_posting.py
          tests/test_sales_receipt_payment_proof.py
          tests/test_sales_invoices_and_receipts.py
          tests/test_physical_stock_engine.py
          tests/test_confirm_delivered_sj_stock.py
          tests/test_operator_schedule.py
          tests/test_division_tasks.py::test_line_tasks_copy_exact_line_screen_size
          tests/test_division_tasks.py::test_operator_task_keeps_each_allocation_screen
          tests/test_division_tasks.py::test_operator_task_keeps_screen_when_line_mirror_empty
          tests/test_production_dashboard_summary.py

  backend-live-orders:
    name: Backend live orders summary
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_orders }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGO_URL: ${{ secrets.LIVE_ORDERS_MONGO_URL }}
      DB_NAME: ${{ secrets.LIVE_ORDERS_DB_NAME }}
      LIVE_ORDERS_DB_NAME: ${{ secrets.LIVE_ORDERS_DB_NAME }}
      JWT_SECRET: ci-only-secret
      LIVE_ORDERS_SUMMARY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install live-check dependencies
        run: >-
          python -m pip install
          pytest==9.1.1
          pytest-xdist==3.8.0
          anyio==4.14.2
          fastapi==0.110.1
          httpx==0.28.1
          pymongo==4.6.3
          python-dotenv==1.2.2
          motor==3.3.1
          bcrypt==4.1.3
          PyJWT==2.13.0
          python-multipart==0.0.32
          boto3==1.43.74
          reportlab==4.1.0
          requests==2.34.2
          openpyxl==3.1.5
          pdfplumber==0.11.10
      - name: Require an existing completed-order database
        run: |
          python - <<'PY'
          import os
          import sys

          missing = []
          if not os.environ.get("MONGO_URL", "").strip():
              missing.append("LIVE_ORDERS_MONGO_URL")
          if not os.environ.get("LIVE_ORDERS_DB_NAME", "").strip():
              missing.append("LIVE_ORDERS_DB_NAME")
          if not missing:
              raise SystemExit(0)
          print("Live orders summary job cannot start.")
          print("Missing repository secrets: " + ", ".join(missing))
          print("Prerequisites:")
          print("- secret LIVE_ORDERS_MONGO_URL")
          print("- secret LIVE_ORDERS_DB_NAME")
          print("- that database already contains at least one non-cancelled order with current_stage >= 14")
          print("This job does not seed or write orders.")
          sys.exit(1)
          PY
      - name: Compare full and summary rows on the live database
        working-directory: backend
        run: >-
          python -m pytest -q -n 0
          tests/test_production_dashboard_summary.py::test_live_summary_matches_default_visible_columns

  frontend-focused:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REACT_APP_BACKEND_URL: http://127.0.0.1:8000
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Run focused frontend tests
        env:
          CI: "true"
        run: >-
          npm test -- --watchAll=false --runInBand
          src/App.boot.test.js
          src/App.phase2a.lazyRoutes.test.js
          src/mobile/MobileRoutes.test.js
          src/mobile/MobileSuratJalanViewerPage.test.js
          src/lib/mobileOpsSession.test.js
          src/lib/mobileTaskListRetention.test.js
          src/lib/poDetailRetention.test.js
          src/mobile/MobileTasksPage.test.js
          src/pages/HoPDashboard.test.js
          src/pages/inventoryPersediaanLiveSearch.contract.test.js
          src/pages/NilaiPersediaan.test.js
          src/pages/NilaiPersediaan.interaction.test.js
          src/pages/BukuBesar.test.js
          src/pages/NeracaSaldo.test.js
          src/sales/SalesPwaLayout.test.js
          src/sales/SalesPwaOrdersPage.test.js
          src/sales/SalesPwaDashboardPage.test.js
          src/sales/SalesPwaVisitsPage.test.js
          src/lib/financialDashboard.test.js
          src/components/AppShell.test.js
          src/lib/navAccess.test.js
          src/lib/navAccess.cashBank.test.js
          src/lib/navAccess.employeeAdmin.test.js
          src/lib/navAccess.formAccess.test.js
          src/lib/navAccess.hrPayroll.test.js
          src/lib/navAccess.ledger.test.js
          src/lib/globalWorkspace.test.js
          src/lib/salesOrderCreateWorkspace.test.js
          src/pages/PesananPenjualan.createWorkspace.test.js
          src/pages/PesananPenjualan.test.js
          src/pages/FakturPenjualan.test.js
          src/components/MasterItemSearchSelect.picker.test.js
          src/lib/salesOrderListPresentation.test.js
          src/pages/PesananPenjualan.searchDebounce.test.js
          src/components/TrackingInvoicePdfViewer.test.js
          src/components/TrackingInvoices.test.js
          src/lib/customerTracking.test.js
          src/lib/liveTracking.test.js
          src/pages/CustomerTrackingPage.test.js
          src/pages/CustomerTrackingPage.onescreen.test.js
          src/pages/PenerimaanPenjualan.test.js
          src/lib/salesReceipts.test.js
          src/lib/salesReceiptPaymentProof.test.js
          src/pages/SalesAccountingSettings.test.js
          src/components/OperatorSplitPanel.screenSize.test.js
      - name: Build production frontend
        if: ${{ always() }}
        env:
          CI: "false"
          DISABLE_ESLINT_PLUGIN: "true"
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
