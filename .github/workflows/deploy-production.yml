name: Deploy production

# Manual immutable-SHA production deploy.
# Secrets are only available in the `deploy` job after the GitHub Environment
# `production` protection rules (reviewers / wait timer) are satisfied.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Immutable 40-char lowercase commit SHA already merged to main
        required: true
        type: string
      confirm_sha:
        description: Must exactly equal commit_sha (operator confirmation)
        required: true
        type: string
      allow_migrations:
        description: Set true ONLY when Owner explicitly approved DB/business migrations in this SHA range
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: eternal-packaging-production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (no deploy secrets)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.normalize.outputs.sha }}
    steps:
      - name: Reject non-main dispatch source
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Deploy workflow may only run from refs/heads/main" >&2
          exit 1

      - name: Normalize and confirm SHA
        id: normalize
        env:
          RAW_SHA: ${{ inputs.commit_sha }}
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
        run: |
          set -euo pipefail
          sha="$(printf '%s' "$RAW_SHA" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          confirm="$(printf '%s' "$CONFIRM_SHA" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be 40 lowercase hex characters" >&2
            exit 1
          fi
          if [[ "$sha" != "$confirm" ]]; then
            echo "confirm_sha must exactly equal commit_sha" >&2
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Checkout main at requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.normalize.outputs.sha }}
          fetch-depth: 0

      - name: Verify SHA is on origin/main ancestry
        env:
          SHA: ${{ steps.normalize.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git rev-parse --verify "${SHA}^{commit}" >/dev/null
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "SHA is not an ancestor of origin/main (unmerged)" >&2
            exit 1
          fi
          # Must equal a commit reachable from main tip (already checked) and
          # refuse detached SHAs that somehow are not on the main history.
          echo "ancestry OK for $SHA"

      - name: Require green CI for SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.normalize.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Prefer check-suites conclusion; fall back to successful workflow runs.
          suites_json="$(gh api "repos/${REPO}/commits/${SHA}/check-suites" --paginate)"
          total="$(printf '%s' "$suites_json" | jq '[.check_suites[]?] | length')"
          if [[ "$total" != "0" ]]; then
            bad="$(printf '%s' "$suites_json" | jq -r '
              [.check_suites[]
                | select(.conclusion != null)
                | select(.conclusion != "success")
                | select(.conclusion != "neutral")
                | select(.conclusion != "skipped")
              ]
              | length')"
            pending="$(printf '%s' "$suites_json" | jq -r '
              [.check_suites[] | select(.status != "completed")] | length')"
            if [[ "$pending" != "0" ]]; then
              echo "CI check suites still pending for $SHA" >&2
              exit 1
            fi
            if [[ "$bad" != "0" ]]; then
              echo "CI check suites not fully successful for $SHA" >&2
              printf '%s\n' "$suites_json" | jq -r '.check_suites[] | "\(.app.name // "app") \(.status) \(.conclusion // "-")"' >&2
              exit 1
            fi
            echo "check-suites OK"
            exit 0
          fi

          # Fallback: require at least one successful workflow run on this SHA
          # for the primary validation workflow.
          runs="$(gh api "repos/${REPO}/actions/workflows/reconciliation-validation.yml/runs?head_sha=${SHA}&status=completed&per_page=20")"
          ok="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.conclusion=="success")] | length')"
          if [[ "$ok" -lt 1 ]]; then
            echo "No successful reconciliation-validation run for $SHA" >&2
            exit 1
          fi
          echo "workflow-run fallback OK"

  deploy:
    name: Deploy via SSH (environment secrets)
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout deploy scripts at SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/deploy
          sparse-checkout-cone-mode: true

      - name: Mask deployment secrets in logs
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "${DEPLOY_HOST}" ]] || { echo "DEPLOY_HOST missing" >&2; exit 1; }
          [[ -n "${DEPLOY_USER}" ]] || { echo "DEPLOY_USER missing" >&2; exit 1; }
          [[ -n "${DEPLOY_SSH_KEY}" ]] || { echo "DEPLOY_SSH_KEY missing" >&2; exit 1; }
          [[ -n "${DEPLOY_KNOWN_HOSTS}" ]] || { echo "DEPLOY_KNOWN_HOSTS missing" >&2; exit 1; }
          echo "::add-mask::${DEPLOY_HOST}"
          echo "::add-mask::${DEPLOY_USER}"
          while IFS= read -r line; do
            [[ -n "$line" ]] || continue
            echo "::add-mask::${line}"
          done <<<"${DEPLOY_SSH_KEY}"
          while IFS= read -r line; do
            [[ -n "$line" ]] || continue
            echo "::add-mask::${line}"
          done <<<"${DEPLOY_KNOWN_HOSTS}"

      - name: Probe SSH gate (fail-closed)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          known_hosts="$(mktemp)"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$known_hosts"
          chmod 600 "$key_file" "$known_hosts"
          port="${DEPLOY_SSH_PORT:-22}"
          cleanup() { rm -f "$key_file" "$known_hosts"; }
          trap cleanup EXIT
          out="$(ssh -i "$key_file" \
            -p "$port" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            probe)"
          printf '%s\n' "$out"
          grep -q 'PASS probe' <<<"$out"

      - name: Deploy immutable SHA
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ needs.preflight.outputs.sha }}
          ALLOW_MIGRATIONS: ${{ inputs.allow_migrations }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          known_hosts="$(mktemp)"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$known_hosts"
          chmod 600 "$key_file" "$known_hosts"
          port="${DEPLOY_SSH_PORT:-22}"
          cleanup() { rm -f "$key_file" "$known_hosts"; }
          trap cleanup EXIT

          # SSH command remains allowlisted: deploy <sha40> only.
          # Migration override stays Owner-controlled on the VPS via ETERNAL_ALLOW_MIGRATIONS.
          if [[ "$ALLOW_MIGRATIONS" == "true" ]]; then
            echo "NOTE: allow_migrations=true requested; VPS must have ETERNAL_ALLOW_MIGRATIONS=1 (Owner-controlled)."
          fi

          ssh -i "$key_file" \
            -p "$port" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "deploy ${SHA}"
