name: Deploy production

# Manual immutable-SHA production deploy or post-success rollback.
# Platform approval: GitHub Environment `production` required reviewers (Owner setup).
# Shared input `deploy_shared_secret` is NOT human approval and NOT a secret store;
# it only matches Environment secret DEPLOY_SHARED_SECRET as a secondary technical gate.
# SSH keys remain Environment secrets only (never in Cursor workspace).
# Rollback does not reverse MongoDB/business transactions.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: deploy (activate SHA) or rollback (restore previous release after DEPLOY_OK)
        required: true
        type: choice
        options:
          - deploy
          - rollback
        default: deploy
      commit_sha:
        description: For deploy = target SHA. For rollback = exact deployed SHA to undo.
        required: true
        type: string
      confirm_sha:
        description: Must exactly equal commit_sha (operator confirmation)
        required: true
        type: string
      previous_release:
        description: Rollback only — predecessor id (40-hex SHA or baseline-active). Ignored for deploy.
        required: false
        type: string
        default: ""
      deploy_shared_secret:
        description: Technical shared secret (NOT human approval). Must match DEPLOY_SHARED_SECRET. Prefer Environment required reviewers for human approval.
        required: true
        type: string
      request_id:
        description: Correlation id from trigger helper (not a secret)
        required: false
        type: string
        default: ""
      allow_migrations:
        description: Deploy only — true ONLY when Owner explicitly approved DB/business migrations in this SHA range
        required: false
        type: boolean
        default: false
      ack_replace_live_frontend:
        description: Deploy only — required true on first cutover when pure SHA replaces live webroot
        required: false
        type: boolean
        default: false

# Whole-token correlation for trigger helper (exact request_id=… match, not prefix).
run-name: Deploy production · request_id=${{ inputs.request_id }}

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: eternal-packaging-production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (no deploy secrets)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.normalize.outputs.sha }}
      previous_id: ${{ steps.normalize.outputs.previous_id }}
      operation: ${{ steps.normalize.outputs.operation }}
      request_id: ${{ steps.normalize.outputs.request_id }}
    steps:
      - name: Normalize and confirm targets
        id: normalize
        env:
          RAW_SHA: ${{ inputs.commit_sha }}
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
          RAW_PREV: ${{ inputs.previous_release }}
          OPERATION: ${{ inputs.operation }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          op="$(printf '%s' "$OPERATION" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [[ "$op" != "deploy" && "$op" != "rollback" ]]; then
            echo "operation must be deploy or rollback" >&2
            exit 1
          fi
          sha="$(printf '%s' "$RAW_SHA" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          confirm="$(printf '%s' "$CONFIRM_SHA" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be 40 lowercase hex characters" >&2
            exit 1
          fi
          if [[ "$sha" != "$confirm" ]]; then
            echo "confirm_sha must exactly equal commit_sha" >&2
            exit 1
          fi
          prev=""
          if [[ "$op" == "rollback" ]]; then
            prev="$(printf '%s' "$RAW_PREV" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            if [[ "$prev" != "baseline-active" && ! "$prev" =~ ^[0-9a-f]{40}$ ]]; then
              echo "previous_release must be 40 lowercase hex or baseline-active" >&2
              exit 1
            fi
          fi
          echo "operation=$op" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "previous_id=$prev" >>"$GITHUB_OUTPUT"
          echo "request_id=${REQUEST_ID}" >>"$GITHUB_OUTPUT"
          echo "PREFLIGHT operation=${op} request_id=${REQUEST_ID:-none} sha=${sha} previous_id=${prev:-n/a}"

      - name: Checkout main at requested SHA
        if: steps.normalize.outputs.operation == 'deploy'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.normalize.outputs.sha }}
          fetch-depth: 0

      - name: Checkout main tip for rollback scripts
        if: steps.normalize.outputs.operation == 'rollback'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify SHA is on origin/main ancestry
        env:
          SHA: ${{ steps.normalize.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git rev-parse --verify "${SHA}^{commit}" >/dev/null
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "SHA is not an ancestor of origin/main (unmerged)" >&2
            exit 1
          fi
          echo "ancestry OK for $SHA"

      - name: Require explicit green CI jobs for deploy SHA
        if: steps.normalize.outputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.normalize.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/deploy/verify_ci_for_sha.sh "$REPO" "$SHA"

  authorize:
    name: Environment gate (actor allowlist + technical secret)
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Enforce Owner actor allowlist (not bypassable by shared secret alone)
        env:
          ALLOWED: ${{ vars.DEPLOY_ALLOWED_ACTORS }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # Fail-closed: technical secret must not be the only gate.
          # Preferred human gate = Environment Required reviewers (if/when available).
          # Enforced substitute for this private repo = repository variable DEPLOY_ALLOWED_ACTORS
          # (comma-separated GitHub logins). Secret alone cannot authorize deploy/rollback.
          if [[ -z "${ALLOWED//[[:space:]]/}" ]]; then
            echo "DEPLOY_ALLOWED_ACTORS unset. Owner must set repo variable to allowed dispatch logins (and prefer Environment Required reviewers if the platform supports them). Refusing secret-only authorization." >&2
            exit 1
          fi
          norm=",$(printf '%s' "$ALLOWED" | tr -d '[:space:]'),"
          if [[ "$norm" != *",${ACTOR},"* ]]; then
            echo "actor=${ACTOR} is not in DEPLOY_ALLOWED_ACTORS; authorization refused" >&2
            exit 1
          fi
          echo "ACTOR_ALLOWLIST_OK actor=${ACTOR}"

      - name: Technical shared-secret gate (secondary; not human approval)
        env:
          GOT: ${{ inputs.deploy_shared_secret }}
          EXPECT: ${{ secrets.DEPLOY_SHARED_SECRET }}
          # Backward-compatible alias while Owner migrates secret name.
          EXPECT_LEGACY: ${{ secrets.DEPLOY_APPROVAL_TOKEN }}
        run: |
          set -euo pipefail
          expect="${EXPECT:-}"
          if [[ -z "$expect" ]]; then
            expect="${EXPECT_LEGACY:-}"
          fi
          if [[ -z "$expect" ]]; then
            echo "DEPLOY_SHARED_SECRET (or legacy DEPLOY_APPROVAL_TOKEN) missing on Environment production" >&2
            exit 1
          fi
          if [[ -z "${GOT}" ]]; then
            echo "deploy_shared_secret input missing" >&2
            exit 1
          fi
          echo "::add-mask::${GOT}"
          got_h="$(printf '%s' "$GOT" | sha256sum | awk '{print $1}')"
          exp_h="$(printf '%s' "$expect" | sha256sum | awk '{print $1}')"
          if [[ "$got_h" != "$exp_h" ]]; then
            echo "deploy_shared_secret does not match environment technical secret" >&2
            exit 1
          fi
          echo "TECHNICAL_GATE_OK"
          echo "OWNER_APPROVAL_NOTE=Shared secret is secondary only. Human control = DEPLOY_ALLOWED_ACTORS (+ Required reviewers when available). Secret alone cannot authorize."

  deploy:
    name: Deploy or rollback via SSH (environment secrets)
    needs: [preflight, authorize]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout deploy scripts (deploy target SHA)
        if: needs.preflight.outputs.operation == 'deploy'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/deploy
          sparse-checkout-cone-mode: true

      - name: Checkout deploy scripts (main tip for rollback)
        if: needs.preflight.outputs.operation == 'rollback'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/deploy
          sparse-checkout-cone-mode: true

      - name: Mask deployment secrets in logs
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "${DEPLOY_HOST}" ]] || { echo "DEPLOY_HOST missing" >&2; exit 1; }
          [[ -n "${DEPLOY_USER}" ]] || { echo "DEPLOY_USER missing" >&2; exit 1; }
          [[ -n "${DEPLOY_SSH_KEY}" ]] || { echo "DEPLOY_SSH_KEY missing" >&2; exit 1; }
          [[ -n "${DEPLOY_KNOWN_HOSTS}" ]] || { echo "DEPLOY_KNOWN_HOSTS missing" >&2; exit 1; }
          echo "::add-mask::${DEPLOY_HOST}"
          echo "::add-mask::${DEPLOY_USER}"
          while IFS= read -r line; do
            [[ -n "$line" ]] || continue
            echo "::add-mask::${line}"
          done <<<"${DEPLOY_SSH_KEY}"
          while IFS= read -r line; do
            [[ -n "$line" ]] || continue
            echo "::add-mask::${line}"
          done <<<"${DEPLOY_KNOWN_HOSTS}"

      - name: Probe SSH gate before operation
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          bash scripts/deploy/ssh_gate_probe.sh

      - name: Run allowlisted SSH operation
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ needs.preflight.outputs.sha }}
          PREVIOUS_ID: ${{ needs.preflight.outputs.previous_id }}
          OPERATION: ${{ needs.preflight.outputs.operation }}
          ALLOW_MIGRATIONS: ${{ inputs.allow_migrations }}
          ACK_REPLACE_LIVE_FRONTEND: ${{ inputs.ack_replace_live_frontend }}
          REQUEST_ID: ${{ needs.preflight.outputs.request_id }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          known_hosts="$(mktemp)"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$known_hosts"
          chmod 600 "$key_file" "$known_hosts"
          port="${DEPLOY_SSH_PORT:-22}"
          cleanup() { rm -f "$key_file" "$known_hosts"; }
          trap cleanup EXIT

          if [[ "$OPERATION" == "rollback" ]]; then
            # Allowlisted rollback only — never arbitrary shell / paths.
            remote_cmd="rollback ${SHA} ${PREVIOUS_ID}"
            echo "ROLLBACK request_id=${REQUEST_ID:-none} deployed_sha=${SHA} previous_id=${PREVIOUS_ID}"
          else
            if [[ "$ALLOW_MIGRATIONS" == "true" ]]; then
              echo "NOTE: allow_migrations=true requested; VPS must have ETERNAL_ALLOW_MIGRATIONS=1 (Owner-controlled)."
            fi
            remote_cmd="deploy ${SHA}"
            if [[ "$ACK_REPLACE_LIVE_FRONTEND" == "true" ]]; then
              # Allowlisted optional token only — never arbitrary shell.
              remote_cmd="deploy ${SHA} ack-fe-replace"
            fi
            echo "DEPLOY request_id=${REQUEST_ID:-none} sha=${SHA} ack_fe=${ACK_REPLACE_LIVE_FRONTEND}"
          fi

          # Literal allowlisted remote command only — never a shell.
          ssh -i "$key_file" \
            -p "$port" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=30 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "$remote_cmd"
