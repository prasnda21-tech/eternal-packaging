name: Frontend production artifact

# Builds a production-equivalent frontend artifact for an exact main SHA.
# Does NOT deploy, restart services, mutate databases, or install the VPS runner.
# Consumption is manual via Windows Terminal → SSH → eternal-deploy-runner (artifact mode).

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-hex commit SHA (must be on origin/main)
        required: true
        type: string
      confirm_sha:
        description: Must exactly equal commit_sha
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: frontend-artifact-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  build-artifact:
    name: Build and upload frontend artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Normalize and confirm SHA
        id: sha
        env:
          RAW_SHA: ${{ inputs.commit_sha }}
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
        run: |
          set -euo pipefail
          sha="$(printf '%s' "$RAW_SHA" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          confirm="$(printf '%s' "$CONFIRM_SHA" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be 40 lowercase hex characters" >&2
            exit 1
          fi
          if [[ "$sha" != "$confirm" ]]; then
            echo "confirm_sha must exactly equal commit_sha" >&2
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0

      - name: Verify SHA is on origin/main ancestry
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git rev-parse --verify "${SHA}^{commit}" >/dev/null
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "SHA is not an ancestor of origin/main (unmerged)" >&2
            exit 1
          fi
          echo "ancestry OK for $SHA"

      - name: Setup Node 20 + Yarn (packageManager pin)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Resolve production frontend build environment (fail-closed)
        id: feenv
        env:
          MODE: ${{ vars.FRONTEND_PROD_ENV_MODE }}
          URL: ${{ vars.FRONTEND_PROD_REACT_APP_BACKEND_URL }}
        run: |
          set -euo pipefail
          # Fail closed when Owner has not confirmed canonical production CRA public env.
          # same-origin: empty REACT_APP_BACKEND_URL (SPA + /api on same nginx host).
          # explicit-url: non-loopback FRONTEND_PROD_REACT_APP_BACKEND_URL repository variable.
          mode="$(printf '%s' "${MODE:-}" | tr -d '[:space:]')"
          case "$mode" in
            same-origin)
              echo "mode=same-origin" >>"$GITHUB_OUTPUT"
              echo "REACT_APP_BACKEND_URL=" >>"$GITHUB_ENV"
              ;;
            explicit-url)
              url="$(printf '%s' "${URL:-}" | tr -d '[:space:]')"
              if [[ -z "$url" ]]; then
                echo "FRONTEND_PROD_ENV_MODE=explicit-url requires repository variable FRONTEND_PROD_REACT_APP_BACKEND_URL" >&2
                exit 1
              fi
              if [[ "$url" =~ ^https?://(127\.0\.0\.1|localhost)(:|/|$) ]]; then
                echo "production URL must not be CI/loopback host" >&2
                exit 1
              fi
              if [[ ! "$url" =~ ^https?:// ]]; then
                echo "FRONTEND_PROD_REACT_APP_BACKEND_URL must be http(s)" >&2
                exit 1
              fi
              echo "mode=explicit-url" >>"$GITHUB_OUTPUT"
              echo "REACT_APP_BACKEND_URL=$url" >>"$GITHUB_ENV"
              ;;
            "")
              echo "BLOCKER: repository variable FRONTEND_PROD_ENV_MODE unset." >&2
              echo "Owner must set FRONTEND_PROD_ENV_MODE=same-origin or explicit-url before artifact builds." >&2
              echo "Do not inherit reconciliation test REACT_APP_BACKEND_URL=http://127.0.0.1:8000." >&2
              exit 1
              ;;
            *)
              echo "FRONTEND_PROD_ENV_MODE invalid: $mode" >&2
              exit 1
              ;;
          esac
          echo "DISABLE_ESLINT_PLUGIN=true" >>"$GITHUB_ENV"
          echo "CI=false" >>"$GITHUB_ENV"
          echo "NODE_OPTIONS=--max-old-space-size=4096" >>"$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build production frontend (CRACO / yarn)
        working-directory: frontend
        run: yarn build

      - name: Pack artifact + manifest
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          FRONTEND_PROD_ENV_MODE: ${{ steps.feenv.outputs.mode }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy/pack_frontend_artifact.sh
          bash scripts/deploy/pack_frontend_artifact.sh \
            --frontend-dir frontend \
            --out-dir dist/frontend-artifact \
            --git-sha "$SHA" \
            --workflow frontend-artifact.yml \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --node-version "$(node -v | tr -d 'v')" \
            --yarn-version "$(yarn -v)"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: eternal-frontend-build-${{ steps.sha.outputs.sha }}
          path: dist/frontend-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
